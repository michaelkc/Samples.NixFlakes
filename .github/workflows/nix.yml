name: Nix demo

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Pre-nix
      run: |
        node --version

    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    # - name: Cachix
    #   uses: cachix/cachix-action@v12
    #   with:
    #     name: your-cache-name # Optional: replace with your cachix cache name
    #     authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}' # Optional: if you want to use cachix

    - name: Post-nix
      run: |
        # Enter the development shell from your flake and run commands
        nix develop --command bash -c "echo 'Nix flake development environment loaded successfully!'"
        
        # Alternative approach: run your tests directly
        # nix develop --command bash -c "your-test-command"
        
        # For more complex scenarios, you can use a script to capture the environment:
        # nix develop --command bash -c "env > nix-env-vars.txt && your-command-here"
        
        # If you need to run multiple commands:
        nix develop --command bash -c "
          echo 'Running in flake environment'
          node --version
        "